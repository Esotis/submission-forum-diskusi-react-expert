name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint, Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Jalankan ESLint
        run: npm run lint

      - name: Jalankan unit & component test (Vitest)
        run: npm test

      - name: Build aplikasi Next.js
        run: npm run build

  e2e:
    name: End-to-End Test (Cypress)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build aplikasi Next.js
        run: npm run build

      - name: Jalankan E2E test (start server produksi, lalu cypress run)
        run: npm run e2e:prod
